<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="An interactive study platform for senior software engineering interviews — DSA, system design, Java, Spring Boot, .NET, Azure, LLD, AI engineering and behavioural prep." />
    <title>Senior Interview Prep</title>
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('sip:theme');
          var theme = stored === 'light' || stored === 'dark'
            ? stored
            : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
          document.documentElement.setAttribute('data-theme', theme);
          var accent = localStorage.getItem('sip:accent');
          if (accent) document.documentElement.setAttribute('data-accent', accent);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
